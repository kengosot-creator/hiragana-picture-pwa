
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ef">
  <title>ひらがな えほん</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #fff9ef;
      color: #66564b;
      text-align: center;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: auto;
      padding: 20px 16px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 28px;
      color: #df8b79;
      letter-spacing: .08em;
    }

    .subtitle { margin: 0 0 16px; color: #9a887b; font-size: 14px; }

    .picture {
      width: 140px;
      height: 115px;
      display: grid;
      place-items: center;
      background: white;
      border-radius: 28px;
      font-size: 78px;
      box-shadow: 0 5px 18px #e9d9c933;
    }

    .word { margin-top: 7px; font-size: 21px; font-weight: bold; color: #7f9d83; }
    .instruction { margin: 14px 0 8px; font-size: 15px; }

    .writing-area {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 1 / 1;
      background: #ffffffb8;
      border: 3px solid #f2e8da;
      border-radius: 28px;
      overflow: hidden;
      touch-action: none;
    }

    #guide, #ink {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #guide { pointer-events: none; }
    #ink { touch-action: none; }

    .actions { display: flex; gap: 12px; margin-top: 18px; }

    button {
      padding: 13px 24px;
      border: 0;
      border-radius: 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .retry { background: #e8dfd4; color: #66564b; }
    .next { background: #edaa98; color: white; box-shadow: 0 4px 0 #d99483; }
    button:active { transform: translateY(2px); }

    .message { min-height: 28px; margin: 12px 0 0; color: #7f9d83; font-weight: bold; }

    .success {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #fff9eff5;
      z-index: 10;
    }

    .success.show { display: flex; }
    .maru { color: #ed8d83; font-size: min(75vw, 360px); line-height: 1; }
    .success-text { color: #7f9d83; font-size: 30px; font-weight: bold; }
  </style>
</head>
<body>
  <main class="app">
    <h1>ひらがな えほん</h1>
    <p class="subtitle">たのしく なぞってみよう！</p>

    <div class="picture" id="picture">🍎</div>
    <div class="word" id="word">りんご</div>
    <p class="instruction">うすい文字を ゆっくり なぞってね</p>

    <div class="writing-area" id="writingArea">
      <canvas id="guide"></canvas>
      <canvas id="ink"></canvas>
    </div>

    <div class="actions">
      <button class="retry" onclick="clearWriting()">もういちど</button>
      <button class="next" onclick="nextLetter()">つぎへ →</button>
    </div>

    <p class="message" id="message">文字の上を なぞってみよう</p>
  </main>

  <div class="success" id="success">
    <div class="maru">〇</div>
    <div class="success-text">よくできたね！</div>
    <button class="next" onclick="closeSuccess()" style="margin-top:24px">つづける</button>
  </div>

  <script>
    
const letters = [
  { letter: "あ", word: "あり", picture: "🐜" },
  { letter: "い", word: "いぬ", picture: "🐶" },
  { letter: "う", word: "うさぎ", picture: "🐰" },
  { letter: "え", word: "えんぴつ", picture: "✏️" },
  { letter: "お", word: "おにぎり", picture: "🍙" },

  { letter: "か", word: "かえる", picture: "🐸" },
  { letter: "き", word: "きりん", picture: "🦒" },
  { letter: "く", word: "くま", picture: "🐻" },
  { letter: "け", word: "けーき", picture: "🍰" },
  { letter: "こ", word: "こあら", picture: "🐨" },

  { letter: "さ", word: "さくら", picture: "🌸" },
  { letter: "し", word: "しろくま", picture: "🐻‍❄️" },
  { letter: "す", word: "すいか", picture: "🍉" },
  { letter: "せ", word: "せみ", picture: "🪲" },
  { letter: "そ", word: "そら", picture: "☁️" },

  { letter: "た", word: "たいよう", picture: "☀️" },
  { letter: "ち", word: "ちょうちょ", picture: "🦋" },
  { letter: "つ", word: "つき", picture: "🌙" },
  { letter: "て", word: "てんとうむし", picture: "🐞" },
  { letter: "と", word: "とり", picture: "🐦" },

  { letter: "な", word: "なす", picture: "🍆" },
  { letter: "に", word: "にんじん", picture: "🥕" },
  { letter: "ぬ", word: "ぬいぐるみ", picture: "🧸" },
  { letter: "ね", word: "ねこ", picture: "🐱" },
  { letter: "の", word: "のり", picture: "🍙" },

  { letter: "は", word: "はな", picture: "🌷" },
  { letter: "ひ", word: "ひよこ", picture: "🐤" },
  { letter: "ふ", word: "ふね", picture: "🚢" },
  { letter: "へ", word: "へび", picture: "🐍" },
  { letter: "ほ", word: "ほし", picture: "⭐" },

  { letter: "ま", word: "まめ", picture: "🫛" },
  { letter: "み", word: "みかん", picture: "🍊" },
  { letter: "む", word: "むし", picture: "🐛" },
  { letter: "め", word: "めだまやき", picture: "🍳" },
  { letter: "も", word: "もも", picture: "🍑" },

  { letter: "や", word: "やさい", picture: "🥦" },
  { letter: "ゆ", word: "ゆきだるま", picture: "⛄" },
  { letter: "よ", word: "よっと", picture: "⛵" },

  { letter: "ら", word: "らいおん", picture: "🦁" },
  { letter: "り", word: "りんご", picture: "🍎" },
  { letter: "る", word: "るすばんでんわ", picture: "☎️" },
  { letter: "れ", word: "れもん", picture: "🍋" },
  { letter: "ろ", word: "ろうそく", picture: "🕯️" },

  { letter: "わ", word: "わに", picture: "🐊" },
  { letter: "を", word: "を", picture: "🌼" },
  { letter: "ん", word: "ぱん", picture: "🍞" },

  { letter: "が", word: "がちょう", picture: "🪿" },
  { letter: "ざ", word: "ざる", picture: "🧺" },
  { letter: "だ", word: "だるま", picture: "🎎" },
  { letter: "ば", word: "ばなな", picture: "🍌" },
  { letter: "ぱ", word: "ぱんだ", picture: "🐼" }
];


    const guide = document.getElementById("guide");
    const ink = document.getElementById("ink");
    const guideCtx = guide.getContext("2d");
    const inkCtx = ink.getContext("2d");
    const area = document.getElementById("writingArea");

    let currentIndex = 0;
    let drawing = false;
    let points = [];
    let checked = false;

    function setupCanvases() {
      const rect = area.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      [guide, ink].forEach(canvas => {
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
      });

      guideCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawGuide();
    }

    function drawGuide() {
      const w = area.clientWidth;
      const h = area.clientHeight;
      guideCtx.clearRect(0, 0, w, h);
      guideCtx.fillStyle = "#dedbd6";
      guideCtx.font = `normal ${Math.round(w * 0.67)}px sans-serif`;
      guideCtx.textAlign = "center";
      guideCtx.textBaseline = "middle";
      guideCtx.fillText(letters[currentIndex].letter, w / 2, h / 2 + 4);
    }

    function position(event) {
      const rect = ink.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function startDrawing(event) {
      if (checked) return;
      event.preventDefault();
      drawing = true;
      points = [];
      ink.setPointerCapture(event.pointerId);
      const p = position(event);
      points.push(p);
      inkCtx.beginPath();
      inkCtx.moveTo(p.x, p.y);
    }

    function draw(event) {
      if (!drawing || checked) return;
      event.preventDefault();
      const p = position(event);
      points.push(p);
      inkCtx.lineWidth = 10;
      inkCtx.lineCap = "round";
      inkCtx.lineJoin = "round";
      inkCtx.strokeStyle = "#e9a08e";
      inkCtx.lineTo(p.x, p.y);
      inkCtx.stroke();
      inkCtx.beginPath();
      inkCtx.moveTo(p.x, p.y);
    }

    function stopDrawing() {
      if (!drawing) return;
      drawing = false;
      inkCtx.beginPath();
      checkWriting();
    }

    function checkWriting() {
      if (points.length < 12) return;

      const w = area.clientWidth;
      const h = area.clientHeight;
      const centerX = w / 2;
      const centerY = h / 2;
      let nearLetter = 0;

      points.forEach(p => {
        const dx = (p.x - centerX) / (w * 0.36);
        const dy = (p.y - centerY) / (h * 0.36);
        if (dx * dx + dy * dy < 1.25) nearLetter++;
      });

      if (points.length >= 45 && nearLetter / points.length > 0.65) {
        checked = true;
        document.getElementById("message").textContent = "できたね！";
        document.getElementById("success").classList.add("show");
      } else {
        document.getElementById("message").textContent = "もう少し なぞってみよう";
      }
    }

    function clearWriting() {
      checked = false;
      points = [];
      inkCtx.clearRect(0, 0, ink.width, ink.height);
      document.getElementById("message").textContent = "文字の上を なぞってみよう";
      document.getElementById("success").classList.remove("show");
    }

    function closeSuccess() {
      document.getElementById("success").classList.remove("show");
    }

    function nextLetter() {
      currentIndex = (currentIndex + 1) % letters.length;
      const item = letters[currentIndex];
      document.getElementById("picture").textContent = item.picture;
      document.getElementById("word").textContent = item.word;
      clearWriting();
      drawGuide();
    }

    ink.addEventListener("pointerdown", startDrawing);
    ink.addEventListener("pointermove", draw);
    ink.addEventListener("pointerup", stopDrawing);
    ink.addEventListener("pointercancel", stopDrawing);
    window.addEventListener("resize", setupCanvases);
    setupCanvases();
  </script>
</body>
</html>
